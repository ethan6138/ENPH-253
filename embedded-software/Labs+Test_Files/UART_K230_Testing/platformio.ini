; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32 @ 6.7.0
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags = 
    -Iinclude
    -I${sysenv.HOME}/.platformio/packages/framework-arduinoespressif32/cores/esp32
    -I${sysenv.HOME}/.platformio/packages/framework-arduinoespressif32/variants/esp32s3
    -I${sysenv.HOME}/.platformio/packages/framework-arduinoespressif32-libs/esp32s3/include/xtensa/include
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_filters = esp32_exception_decoder
lib_deps =
    Adafruit SSD1306
    bblanchon/ArduinoJson@^7 
upload_port = /dev/ttyACM0
